<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Nav</title>
    <link rel="stylesheet" href="style.css">
</head>

<body
    class="bg-slate-50 text-slate-800 h-screen flex overflow-hidden font-sans antialiased selection:bg-indigo-100 selection:text-indigo-700 dark:bg-slate-900 dark:text-slate-200 dark:selection:bg-indigo-900 dark:selection:text-indigo-300">

    <div
        class="container mx-auto max-w-[1920px] flex w-full h-full bg-white shadow-2xl overflow-hidden dark:bg-slate-900 dark:shadow-none">

        <!-- 左侧书签目录 Sidebar -->
        <aside
            class="w-72 bg-slate-50 border-r border-slate-200 flex flex-col flex-shrink-0 transition-all duration-300 dark:bg-slate-900 dark:border-slate-700">
            <div
                class="px-6 pt-7 pb-4 flex-shrink-0">
                <h1 class="text-xl font-bold text-slate-800 flex items-center gap-3 dark:text-slate-100">
                    <span
                        class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white shadow-sm shadow-indigo-200">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path>
                        </svg>
                    </span>
                    My Bookmarks
                </h1>
            </div>

            <!-- 目录树容器 -->
            <div id="bookmark-tree" class="flex-1 overflow-y-auto px-3 pt-3 pb-4 space-y-1 custom-scrollbar">
                <!-- JS动态生成内容 -->
            </div>
        </aside>

        <!-- 右侧站点导航 Main Content -->
        <main class="flex-1 flex flex-col min-w-0 bg-white relative dark:bg-slate-900">

            <!-- 头部 (Hero Header) -->
            <header
                class="border-b border-slate-200 bg-white/80 backdrop-blur-md flex flex-col sticky top-0 z-20 dark:bg-slate-900/80 dark:border-slate-700 transition-all duration-300">

                <!-- 工具栏: 面包屑 & 书签过滤 -->
                <div class="px-8 py-3 flex justify-between items-center gap-4">
                    <!-- 面包屑导航 -->
                    <nav id="breadcrumbs"
                        class="flex items-center text-sm text-slate-500 dark:text-slate-400 overflow-hidden whitespace-nowrap mask-image-linear-fade">
                        <!-- JS 注入 -->
                        <span class="flex items-center gap-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
                                </path>
                            </svg>
                            Home
                        </span>
                    </nav>

                    <!-- 右侧工具栏 -->
                    <div class="flex items-center gap-3">
                        <!-- 书签过滤器 -->
                        <div class="relative group flex-shrink-0 w-64 transition-all focus-within:w-80">
                            <input type="text" id="search-input" placeholder="Search bookmarks..."
                                class="w-full pl-9 pr-4 py-1.5 bg-slate-100 border-transparent rounded-lg text-sm focus:bg-white focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all dark:bg-slate-800 dark:text-slate-200 dark:focus:bg-slate-700">
                            <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 transition-colors group-focus-within:text-indigo-500"
                                fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                        </div>

                        <!-- 主题切换开关 -->
                        <button id="theme-toggle" class="p-2 rounded-lg bg-slate-100 text-slate-500 hover:bg-slate-200 hover:text-indigo-600 transition-colors dark:bg-slate-800 dark:text-slate-400 dark:hover:bg-slate-700 dark:hover:text-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/50" title="Toggle theme">
                            <!-- Sun Icon (显示在浅色模式，提示切换到深色或系统) -->
                            <svg id="theme-toggle-light-icon" class="w-5 h-5 block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                            <!-- Moon Icon (显示在深色模式，提示切换到浅色或系统) -->
                            <svg id="theme-toggle-dark-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                            <!-- System Icon (显示在跟随系统模式，提示切换到浅色/深色) -->
                            <svg id="theme-toggle-system-icon" class="w-5 h-5 hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-monitor"><rect width="20" height="14" x="2" y="3" rx="2"></rect><line x1="8" x2="16" y1="21" y2="21"></line><line x1="12" x2="12" y1="17" y2="21"></line></svg>
                        </button>
                    </div>
                </div>


            </header>

            <!-- 站点列表容器 -->
            <div id="bookmark-sites" class="flex-1 overflow-y-auto px-8 py-8 bg-slate-50/50 dark:bg-slate-900 custom-scrollbar">
                <!-- JS动态生成内容 -->
            </div>
        </main>
    </div>

    <!-- 右键菜单 (Context Menu) -->
    <div id="context-menu"
        class="hidden fixed z-50 w-36 bg-white rounded-xl shadow-lg border border-slate-100 py-1.5 ring-1 ring-black/5 transform origin-top-left transition-all duration-100 scale-95 opacity-0 dark:bg-slate-800 dark:border-slate-700 dark:ring-white/10">
        <button id="ctx-new-folder"
            class="hidden w-full text-left px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 hover:text-indigo-600 flex items-center gap-2 transition-colors dark:text-slate-300 dark:hover:bg-slate-700 dark:hover:text-indigo-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path>
            </svg>
            New Folder
        </button>
        <button id="ctx-edit"
            class="w-full text-left px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 hover:text-indigo-600 flex items-center gap-2 transition-colors dark:text-slate-300 dark:hover:bg-slate-700 dark:hover:text-indigo-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
                </path>
            </svg>
            Edit
        </button>
        <button id="ctx-delete"
            class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 flex items-center gap-2 transition-colors dark:text-red-400 dark:hover:bg-red-900/20">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                </path>
            </svg>
            Delete
        </button>
    </div>

    <!-- 新建文件夹模态框 (New Folder Modal) -->
    <div id="new-folder-modal" class="modal-root hidden z-[60]" aria-labelledby="new-folder-modal-title"
        role="dialog" aria-modal="true">
        <div class="modal-backdrop"></div>

        <div class="modal-shell">
            <div data-new-folder-panel class="modal-panel">
                <div class="modal-body">
                    <h3 class="modal-title mb-4" id="new-folder-modal-title">New Folder</h3>
                    <form id="new-folder-form" class="space-y-4">
                        <div>
                            <label for="new-folder-name" class="modal-label">Name</label>
                            <input type="text" id="new-folder-name" class="modal-input" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="btn-create-folder"
                        class="modal-button-primary">Create</button>
                    <button type="button" id="btn-new-folder-cancel"
                        class="modal-button-secondary">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 编辑模态框 (Edit Modal) -->
    <div id="edit-modal" class="modal-root hidden z-[60]" aria-labelledby="modal-title" role="dialog"
        aria-modal="true">
        <!-- 背景遮罩 -->
        <div class="modal-backdrop"></div>

        <div class="modal-shell">
            <div class="modal-panel">
                <div class="modal-body">
                    <h3 class="modal-title mb-4" id="modal-title">
                        Edit Bookmark</h3>
                    <form id="edit-form" class="space-y-4">
                        <div>
                            <label for="edit-title"
                                class="modal-label">Name</label>
                            <input type="text" id="edit-title"
                                class="modal-input"
                                required>
                        </div>
                        <div>
                            <label for="edit-url"
                                class="modal-label">URL</label>
                            <input type="url" id="edit-url"
                                class="modal-input"
                                required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" id="btn-save"
                        class="modal-button-primary">Save</button>
                    <button type="button" id="btn-cancel"
                        class="modal-button-secondary">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 删除确认模态框 (Delete Modal) -->
    <div id="delete-modal" class="modal-root hidden z-[70]" aria-labelledby="delete-modal-title"
        aria-describedby="delete-modal-description" role="dialog" aria-modal="true">
        <div class="modal-backdrop"></div>

        <div class="modal-shell">
            <div data-delete-panel class="modal-panel">
                <div class="modal-body">
                    <h3 id="delete-modal-title" class="modal-title">Delete item?</h3>
                    <p id="delete-modal-description" class="modal-description mt-2">
                        This action cannot be undone.
                    </p>

                    <div class="modal-readonly-field mt-4">
                        <p id="delete-modal-name"
                            class="text-sm font-semibold text-slate-800 break-all dark:text-slate-100">Untitled</p>
                        <p id="delete-modal-meta"
                            class="mt-1 text-xs leading-5 text-slate-500 break-all dark:text-slate-400"></p>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" id="btn-delete-confirm"
                        class="modal-button-danger">Delete</button>
                    <button type="button" id="btn-delete-cancel"
                        class="modal-button-secondary">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
