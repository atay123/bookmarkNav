<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>书签导航</title>
    <link rel="stylesheet" href="style.css">
</head>

<body
    class="bg-slate-50 text-slate-800 h-screen flex overflow-hidden font-sans antialiased selection:bg-indigo-100 selection:text-indigo-700">

    <div class="container mx-auto max-w-[1920px] flex w-full h-full bg-white shadow-2xl overflow-hidden">

        <!-- 左侧书签目录 Sidebar -->
        <aside
            class="w-72 bg-slate-50 border-r border-slate-200 flex flex-col flex-shrink-0 transition-all duration-300">
            <div class="p-6 border-b border-slate-200 bg-white/50 backdrop-blur-sm sticky top-0 z-10">
                <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                    <span
                        class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white shadow-lg shadow-indigo-200">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path>
                        </svg>
                    </span>
                    我的书签
                </h2>
            </div>

            <!-- 目录树容器 -->
            <div id="bookmark-tree" class="flex-1 overflow-y-auto p-4 space-y-1 custom-scrollbar">
                <!-- JS动态生成内容 -->
            </div>
        </aside>

        <!-- 右侧站点导航 Main Content -->
        <main class="flex-1 flex flex-col min-w-0 bg-white relative">
            <!-- 顶部装饰条 -->
            <div
                class="h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 w-full absolute top-0 left-0 z-20">
            </div>

            <!-- 头部 -->
            <header
                class="px-12 py-4 border-b border-slate-200 bg-white/50 backdrop-blur-sm flex justify-between items-center sticky top-0 z-10">
                <div>
                    <h2 id="current-folder-title" class="text-2xl font-bold text-slate-800 tracking-tight">常用网站</h2>
                    <p class="text-slate-500 text-sm mt-1" id="folder-count">加载中...</p>
                </div>
                <div class="flex items-center gap-3">
                    <div class="relative group">
                        <input type="text" id="search-input" placeholder="搜索书签..."
                            class="w-72 pl-11 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all shadow-sm group-hover:bg-white group-hover:shadow-md">
                        <svg class="w-5 h-5 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 transition-colors group-hover:text-indigo-500"
                            fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                </div>
            </header>

            <!-- Google 搜索栏 -->
            <div class="px-12 pt-6 pb-2">
                <form action="https://www.google.com/search" method="get" class="relative max-w-2xl mx-auto group">
                    <div
                        class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-hover:text-indigo-500 transition-colors">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z" />
                        </svg>
                    </div>
                    <input type="text" name="q" placeholder="在 Google 上搜索..." autocomplete="off"
                        class="w-full pl-12 pr-4 py-3 bg-white border border-slate-200 rounded-2xl shadow-sm text-slate-700 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/50 transition-all hover:shadow-md">
                </form>
            </div>

            <!-- 站点列表容器 -->
            <div id="bookmark-sites" class="flex-1 overflow-y-auto px-12 py-8 bg-slate-50/50">
                <!-- JS动态生成内容 -->
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
